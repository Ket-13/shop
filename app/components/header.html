
  <header class="header">
    <div class="container">
      <div class="header__inner">
        <div class="header__logo">
          <a class="logo" href="#">
            <img class="logo__img" src="images/logo.svg" alt="logo">
          </a>
        </div>
        <ul class="header__lang">
          <li class="header__lang-item header__lang--active">
            <a class="header__lang-ling" href="/en" aria-label="Switch language to English">EN</a>/
          </li>
           <li class="header__lang-item">
            <a class="header__lang-ling" href="/ua" aria-label="Switch language to Ukrainian">UA</a>
          </li>
        </ul>
        <nav class="menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__item-link" href="#">CATALOG</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#">COLLECTIONS</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#">ABOUT</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#">BOOK AN APPOINTMENT</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#">CONTACT</a>
            </li>
          </ul>
        </nav>
        <ul class="header__actions">
          <li class="header__actions-item">
            <a class="header__actions-link" href="/account" aria-label="Open account page">
              <svg width="24" height="24">
                <use xlink:href="images/sprite.svg#user"></use>
              </svg>
            </a>
          </li>
           <li class="header__actions-item">
            <a class="header__actions-link" href="/favorites" aria-label="Open favorites">
              <svg width="24" height="22">
                <use xlink:href="images/sprite.svg#wishlist"></use>
              </svg>
            </a>
          </li>
           <li class="header__actions-item">
            <a class="header__actions-link" href="/cart" aria-label="Open shopping cart">
              <svg width="24" height="24">
                <use xlink:href="images/sprite.svg#shopping-bag"></use>
              </svg>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </header>
