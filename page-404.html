
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luxurious Bridal Haven</title>
  <link rel="stylesheet" href="css/style.min.css">
</head>

<body>

 <div class="wrapper">

<div class="promo">
    <div class="container">
        <p class="promo-text">
            SAVE 10% OFF WHEN YOU <a href="#">SIGN UP</a>
        </p>
    </div>
</div>

  <header class="header">
    <div class="container">
      <div class="header__inner">
        <div class="header__logo">
          <a class="logo" href="#">
            <img class="logo__img" src="images/logo.svg" alt="logo">
          </a>
        </div>
        <ul class="header__lang">
          <li class="header__lang-item header__lang--active">
            <a class="header__lang-ling" href="/en" aria-label="Switch language to English">EN</a>/
          </li>
           <li class="header__lang-item">
            <a class="header__lang-ling" href="/ua" aria-label="Switch language to Ukrainian">UA</a>
          </li>
        </ul>
        <nav class="menu">
          <ul class="menu__list">
            <li class="menu__item">
              <a class="menu__item-link" href="#">CATALOG</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#">COLLECTIONS</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#">ABOUT</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#">BOOK AN APPOINTMENT</a>
            </li>
            <li class="menu__item">
              <a class="menu__item-link" href="#">CONTACT</a>
            </li>
          </ul>
        </nav>
        <ul class="header__actions">
          <li class="header__actions-item">
            <a class="header__actions-link" href="/account" aria-label="Open account page">
              <svg width="24" height="24">
                <use xlink:href="images/sprite.svg#user"></use>
              </svg>
            </a>
          </li>
           <li class="header__actions-item">
            <a class="header__actions-link" href="/favorites" aria-label="Open favorites">
              <svg width="24" height="22">
                <use xlink:href="images/sprite.svg#wishlist"></use>
              </svg>
            </a>
          </li>
           <li class="header__actions-item">
            <a class="header__actions-link" href="/cart" aria-label="Open shopping cart">
              <svg width="24" height="24">
                <use xlink:href="images/sprite.svg#shopping-bag"></use>
              </svg>
            </a>
          </li>
        </ul>
      </div>
    </div>
  </header>

    <main class="main">
        <div class="page-404__container">
            <div class="page-404__inner">
                <picture>
                  <source srcset="images/img-404-1.avif" type="image/avif">
                  <source srcset="images/img-404-1.webp" type="image/webp">
                  <img src="images/img-404-1.jpg" alt="Alt text">
                </picture>
                <div class="page-404__content">
                    <p class="page-404__title">( 404 )</p>
                    <a class="page-404__link" href="#">
                       <span>Return to the main page </span>
                       <img src="images/img-404-decor.svg" alt="">
                    </a>
                </div>
                <picture>
                  <source srcset="images/img-404-2.avif" type="image/avif">
                  <source srcset="images/img-404-2.webp" type="image/webp">
                  <img src="images/img-404-2.jpg" alt="Alt text">
                </picture>
            </div>
        </div>
        <div class="moving">
            <p class="moving__text">
                page not found
                <img src="images/moving-decor.svg" alt="arrow">
                page not found
                <img src="images/moving-decor.svg" alt="arrow">
                page not found
                <img src="images/moving-decor.svg" alt="arrow">
                page not found
                <img src="images/moving-decor.svg" alt="arrow">
                page not found
                <img src="images/moving-decor.svg" alt="arrow">
                page not found
                <img src="images/moving-decor.svg" alt="arrow">
                page not found
                <img src="images/moving-decor.svg" alt="arrow">
            </p>
        </div>
    </main>
    </div>
    
    <script src="js/main.min.js"></script>
    </body>
    
    </html>
